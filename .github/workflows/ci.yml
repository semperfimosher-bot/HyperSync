name: CI

on:
  push:
    branches:
      - feature/security-offline-pwa-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hypersync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hypersync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      ADMIN_BOOTSTRAP_SECRET: ci-test-admin-bootstrap-secret-1234567890
      JWT_SECRET: ci-test-jwt-secret-that-is-longer-than-thirty-two-characters
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hypersync_test
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hypersync_test
      DATABASE_SSL: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.backend.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.backend.txt
          pip install pytest pytest-asyncio

      - name: Apply test database migrations
        run: python -m alembic upgrade head

      - name: Run backend tests
        run: python -m pytest -q -W error

      - name: Dependency audit
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.backend.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Dependency audit
        continue-on-error: true
        run: npm audit --audit-level=high
