name: Offline PWA branch validation

on:
  push:
    branches:
      - feature/offline-pwa-downloads
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard branch scope
        shell: bash
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          bad="$(printf '%s\n' "$changed" | grep -v -E '^(frontend/(package\.json|src/(artworkUrl\.js|audioPlayer\.js|mediaStore\.js|mediaStore\.test\.js|offlineDownloads\.js|playerQueue\.js|playerQueue\.test\.js|serviceWorker\.js|serviceWorker\.test\.js|components/lyrics/LiveLyrics\.jsx|components/pages/(HomePage|LibraryPage|SearchPage)\.jsx|components/ui/TrackArtwork\.jsx))|\.github/workflows/feature-offline-pwa-ci\.yml)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected files changed:"
            echo "$bad"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend regression tests
        working-directory: frontend
        run: |
          node --test \
            src/appViewState.test.js \
            src/audioMetadata.test.js \
            src/lyricsSync.test.js \
            src/mediaCacheResponse.test.js \
            src/mediaChunkSource.test.js \
            src/mediaNetworkCache.test.js \
            src/mediaPlayback.test.js \
            src/mediaRange.test.js \
            src/mediaResponse.test.js \
            src/mediaStore.test.js \
            src/mediaStreamResponse.test.js \
            src/playerQueue.test.js \
            src/profileMobileRecentlyPlayed.test.js \
            src/rightRailTabs.test.js \
            src/searchAlphabeticalIntegration.test.js \
            src/searchAlphabeticalResults.test.js \
            src/searchQuickCommandOrder.test.js \
            src/searchSortOptions.test.js \
            src/searchTopSignal.test.js \
            src/serviceWorker.test.js \
            src/serviceWorkerRegistration.test.js

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
