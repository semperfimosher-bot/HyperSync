name: Offline PWA branch validation

on:
  push:
    branches:
      - feature/offline-pwa-downloads

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Focused tests
        working-directory: frontend
        run: |
          node --test \
            src/mediaStore.test.js \
            src/offlineDownloads.test.js \
            src/playerQueue.test.js \
            src/serviceWorker.test.js \
            src/serviceWorkerRegistration.test.js
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Audit
        working-directory: frontend
        run: npm audit --audit-level=high
