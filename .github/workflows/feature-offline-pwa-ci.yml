name: Playlist notification repair validation

on:
  push:
    branches:
      - feature/offline-pwa-downloads

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Run notification and offline tests
        run: |
          node --test \
            src/playlistDownloadUpdates.test.js \
            src/mediaStore.test.js \
            src/offlineDownloads.test.js \
            src/mediaPlayback.test.js \
            src/serviceWorker.test.js
      - name: Build
        run: npm run build
