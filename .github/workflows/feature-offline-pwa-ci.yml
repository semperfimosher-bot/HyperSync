name: Offline PWA branch validation

on:
  push:
    branches:
      - feature/offline-pwa-downloads

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard branch scope
        shell: bash
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          bad="$(printf '%s\n' "$changed" | grep -v -E '^(frontend/src/(artworkUrl\.js|audioPlayer\.js|mediaStore\.js|mediaStore\.test\.js|offlineDownloadMath\.js|offlineDownloads\.js|offlineDownloads\.test\.js|playerQueue\.js|playerQueue\.test\.js|serviceWorker\.js|serviceWorker\.test\.js|components/lyrics/LiveLyrics\.jsx|components/pages/(HomePage|LibraryPage|SearchPage)\.jsx|components/ui/TrackArtwork\.jsx|styles/search\.css)|\.github/workflows/feature-offline-pwa-ci\.yml)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected files changed:"
            echo "$bad"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run PWA regression tests
        working-directory: frontend
        run: |
          node --test \
            src/mediaStore.test.js \
            src/offlineDownloads.test.js \
            src/playerQueue.test.js \
            src/serviceWorker.test.js \
            src/serviceWorkerRegistration.test.js

      - name: Build production frontend
        working-directory: frontend
        run: npm run build
