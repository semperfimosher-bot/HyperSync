name: Offline PWA checks

on:
  workflow_dispatch:

  push:
    branches:
      - feature/offline-pwa-downloads
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run offline regression tests
        run: npm run test:offline

      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        run: npm run build

  backend-syntax:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ci-test-secret-for-hypersync-that-is-over-32-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install backend test dependencies
        run: python -m pip install -r requirements.dev.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Validate Alembic migration chain
        env:
          MIGRATION_DATABASE_URL: postgresql://user:password@localhost/hypersync
        run: python -m alembic upgrade head --sql > /tmp/hypersync-migrations.sql

      - name: Run admin security and media regression tests
        run: python -m pytest -q tests/test_admin_full_reset.py tests/test_admin_registration.py tests/test_admin_user_management.py tests/test_admin_bulk_track_delete.py tests/test_production_hardening.py tests/test_upload_duplicate_prevention.py tests/test_audio_compression.py tests/test_direct_upload_strategy.py tests/test_b2_presigned_urls.py tests/test_catalog_media_urls.py tests/test_track_lyrics.py tests/test_lrclib_service.py tests/test_messaging.py tests/test_account_playback_sync.py tests/test_password_recovery.py tests/test_profile_media_urls.py tests/test_search_sections.py tests/test_artists.py tests/test_audio_metadata.py tests/test_autoplay_context.py

      - name: Audit backend dependencies
        run: python -m pip_audit -r requirements.backend.txt

      - name: Scan backend for security issues
        run: python -m bandit -q -r backend bot -ll
