name: Offline PWA checks

on:
  push:
    branches:
      - feature/offline-pwa-downloads
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run offline regression tests
        run: npm run test:offline

      - name: Build frontend
        run: npm run build

  backend-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install backend test dependencies
        run: python -m pip install -r requirements.dev.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Run admin security and media regression tests
        run: python -m pytest -q tests/test_admin_full_reset.py tests/test_admin_registration.py tests/test_upload_duplicate_prevention.py tests/test_audio_compression.py
