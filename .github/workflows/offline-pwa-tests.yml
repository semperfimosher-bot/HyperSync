name: Offline PWA checks

on:
  workflow_dispatch:

  push:
    branches:
      - feature/offline-pwa-downloads
      - fix/production-migration-startup
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run offline regression tests
        run: npm run test:offline

      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        run: npm run build

  backend-syntax:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: verification
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: verification
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verification -d verification"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      JWT_SECRET: ci-test-secret-for-hypersync-that-is-over-32-characters
      # CI-only placeholder: configuration and migration SQL checks do not connect to this host.
      DATABASE_URL: postgresql://verification:disposable-ci-only@localhost:5432/verification
      HYPERSYNC_TEST_POSTGRES_URL: postgresql://verification:disposable-ci-only@127.0.0.1:5432/verification

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate local PowerShell helpers
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @(
            "go.ps1",
            "install-go.ps1",
            "update-local.ps1",
            "reboot-local.ps1",
            "backfill-metadata.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error (
                $path + ": " +
                (($errors | ForEach-Object Message) -join "; ")
              )
            }
          }

          if ($failed) {
            exit 1
          }

      - name: Install backend test dependencies
        run: python -m pip install -r requirements.dev.txt

      - name: Compile backend
        run: python -m compileall -q backend scripts

      - name: Validate local on-demand readiness helper
        shell: pwsh
        run: |
          $output = @(
            python scripts/local_on_demand_readiness.py
          )

          if ($LASTEXITCODE -ne 0) {
            throw "Local readiness helper failed."
          }

          foreach ($required in @(
            "database_kind=",
            "database=",
            "b2=",
            "cookies=",
            "admin="
          )) {
            if (-not ($output | Where-Object { $_.StartsWith($required) })) {
              throw ("Missing readiness field: " + $required)
            }
          }

      - name: Validate Alembic migration chain
        env:
          MIGRATION_DATABASE_URL: postgresql://verification:disposable-ci-only@localhost:5432/verification
        run: python -m alembic upgrade head --sql > /tmp/hypersync-migrations.sql

      - name: Enable PostgreSQL test extensions
        run: |
          PGPASSWORD=disposable-ci-only psql \
            -h 127.0.0.1 \
            -U verification \
            -d verification \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"

      - name: Run full backend regression suite
        run: python -m pytest -q

      - name: Lint backend, bot, scripts, and tests
        run: python -m ruff check backend bot scripts tests

      - name: Type-check backend, bot, scripts, and tests
        run: python -m pyright

      - name: Audit backend dependencies
        run: python -m pip_audit -r requirements.backend.txt

      - name: Scan backend for security issues
        run: python -m bandit -q -r backend bot -ll

  backend-image:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production backend image
        run: docker build --file Dockerfile.backend --tag hypersynced-backend-ci .

      - name: Verify yt-dlp, Deno, Node, FFmpeg, and migrations
        run: |
          docker run --rm hypersynced-backend-ci python -c "import yt_dlp; print(yt_dlp.version.__version__)"
          docker run --rm hypersynced-backend-ci python -c "import yt_dlp_ejs; print('yt-dlp-ejs available')"
          docker run --rm hypersynced-backend-ci deno --version
          docker run --rm hypersynced-backend-ci node --version
          docker run --rm hypersynced-backend-ci ffmpeg -version
          docker run --rm hypersynced-backend-ci python -c "import os; print(os.environ['YT_DLP_DENO_PATH'])"
          docker run --rm \
            -e DATABASE_URL=postgresql://user:password@localhost/hypersync \
            -e MIGRATION_DATABASE_URL=postgresql://user:password@localhost/hypersync \
            --entrypoint sh \
            hypersynced-backend-ci \
            -lc 'cd /app/backend && python -m alembic -c /app/alembic.ini upgrade head --sql >/tmp/hypersynced-migrations.sql && test -s /tmp/hypersynced-migrations.sql'
          docker inspect \
            --format '{{json .Config.Cmd}}' \
            hypersynced-backend-ci \
            | grep -q 'alembic'

  frontend-image:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production frontend image
        run: docker build --file frontend/Dockerfile --tag hypersynced-frontend-ci .

      - name: Verify default and staging Nginx configuration
        shell: bash
        run: |
          set -euo pipefail
          name="hypersynced-frontend-ci"
          cleanup() {
            docker rm --force "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$name" \
            -e API_UPSTREAM_URL=https://127.0.0.1:9443 \
            -e API_UPSTREAM_HOST=staging-api.example.test \
            -e FRONTEND_WS_ORIGIN=wss://hypersync-staging.example.test \
            hypersynced-frontend-ci

          for attempt in $(seq 1 20); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$name")" != "true" ]; then
              docker logs "$name"
              exit 1
            fi
            if docker exec "$name" nginx -t >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          docker exec "$name" nginx -t
          docker exec "$name" sh -ec '
            grep -Fq "proxy_pass https://127.0.0.1:9443;" /etc/nginx/conf.d/default.conf
            grep -Fq "proxy_set_header Host staging-api.example.test;" /etc/nginx/conf.d/default.conf
            grep -Fq "proxy_ssl_name staging-api.example.test;" /etc/nginx/conf.d/default.conf
            grep -Fq "wss://hypersync-staging.example.test" /etc/nginx/security-headers.conf
          '

          docker exec "$name" wget -qO- http://127.0.0.1/health | grep -Fxq healthy
