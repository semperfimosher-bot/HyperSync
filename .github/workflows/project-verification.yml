name: Project verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Verification suite
        type: choice
        options: [quick, full, endurance]
        default: full
      duration:
        description: Endurance duration in minutes
        default: '30'
        type: string

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: verification
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: verification
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U verification -d verification" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.dev.txt
      - run: npm ci --prefix frontend
      - name: Install browsers and media dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify isolated application
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql://verification:disposable-ci-only@127.0.0.1:5432/verification
          JWT_SECRET: ci-test-secret-for-hypersync-that-is-over-32-characters
          SUITE: ${{ inputs.suite || 'full' }}
          DURATION: ${{ inputs.duration || '30' }}
          HYPERSYNC_TEST_POSTGRES_URL: postgresql://verification:disposable-ci-only@127.0.0.1:5432/verification
        run: python scripts/verify_project.py --suite "$SUITE" --duration-minutes "$DURATION"
      - name: Verify PostgreSQL for explicitly selected quick runs
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.suite == 'quick' }}
        env:
          HYPERSYNC_TEST_POSTGRES_URL: postgresql://verification:disposable-ci-only@127.0.0.1:5432/verification
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from uuid import uuid4
          from scripts.verification.postgres import verify_postgres
          from scripts.verification.models import aggregate_exit_code
          from scripts.verification.reporting import write_report
          target = Path('verification-results/postgres')
          target.mkdir(parents=True, exist_ok=True)
          results = verify_postgres(os.environ['HYPERSYNC_TEST_POSTGRES_URL'], uuid4().hex, target)
          write_report(target, {'suite': 'postgres'}, results)
          raise SystemExit(aggregate_exit_code(results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.run_id }}
          path: verification-results/
          retention-days: 14
          if-no-files-found: warn
  windows-runner:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.dev.txt
      - run: python -m pytest tests/test_verification_runner.py tests/test_verification_reporting.py tests/test_verification_processes.py -q
