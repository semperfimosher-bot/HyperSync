server {
    listen 80;
    server_name _;
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Vite's hashed JS/CSS assets must NEVER
    # fall back to index.html.
    location /assets/ {
        try_files $uri =404;

        include /etc/nginx/security-headers.conf;

        add_header Cache-Control
            "public, max-age=31536000, immutable";
    }

    # Always get a fresh index.html after deploys.
    location = /index.html {
        try_files $uri =404;

        include /etc/nginx/security-headers.conf;

        add_header Cache-Control
            "no-cache, no-store, must-revalidate";
    }

    # React SPA routes may fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
