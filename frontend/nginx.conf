server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.backblazeb2.com; media-src 'self' blob: https://*.backblazeb2.com; connect-src 'self' https://api.hypersynced.app https://*.backblazeb2.com; manifest-src 'self'; worker-src 'self' blob:" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Vite's hashed JS/CSS assets must NEVER
    # fall back to index.html.
    location /assets/ {
        try_files $uri =404;

        add_header Cache-Control
            "public, max-age=31536000, immutable";
    }

    # Always get a fresh index.html after deploys.
    location = /index.html {
        try_files $uri =404;

        add_header Cache-Control
            "no-cache, no-store, must-revalidate";
    }

    # React SPA routes may fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
