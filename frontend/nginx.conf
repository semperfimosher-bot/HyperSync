server {
    listen 80;
    server_name _;
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Keep browser API and realtime traffic same-origin.
    # This prevents upstream 5xx responses from being
    # misreported by browsers as CORS failures.
    location /api/ {
        proxy_http_version 1.1;

        proxy_set_header Host api.hypersynced.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_ssl_server_name on;
        proxy_ssl_name api.hypersynced.app;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;

        proxy_buffering off;
        proxy_pass https://api.hypersynced.app;
    }

    # Vite's hashed JS/CSS assets must NEVER
    # fall back to index.html.
    location /assets/ {
        try_files $uri =404;

        include /etc/nginx/security-headers.conf;

        add_header Cache-Control
            "public, max-age=31536000, immutable";
    }

    # Always get a fresh index.html after deploys.
    location = /index.html {
        try_files $uri =404;

        include /etc/nginx/security-headers.conf;

        add_header Cache-Control
            "no-cache, no-store, must-revalidate";
    }

    # React SPA routes may fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
