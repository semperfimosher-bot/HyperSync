server {
    listen 80;
    server_name _;
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Keep browser API and realtime traffic same-origin. The Docker
    # entrypoint renders this template using API_UPSTREAM_URL and
    # API_UPSTREAM_HOST, allowing staging to use its own backend.
    location /api/ {
        include /etc/nginx/security-headers.conf;

        # API responses may contain account-specific or sensitive data.
        # Never let the browser or an intermediary persist them.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;

        proxy_http_version 1.1;

        proxy_set_header Host ${API_UPSTREAM_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_ssl_server_name on;
        proxy_ssl_name ${API_UPSTREAM_HOST};

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;

        proxy_buffering off;
        proxy_pass ${API_UPSTREAM_URL};
    }

    # Vite's content-hashed JS/CSS assets are immutable and must NEVER
    # fall back to index.html.
    location /assets/ {
        try_files $uri =404;

        include /etc/nginx/security-headers.conf;

        add_header Cache-Control
            "public, max-age=31536000, immutable" always;
    }

    # Cache public, non-fingerprinted images, icons, and fonts briefly.
    # Missing files must remain 404s instead of returning the SPA shell.
    location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?|ttf|otf)$ {
        try_files $uri =404;

        include /etc/nginx/security-headers.conf;

        add_header Cache-Control "public, max-age=86400" always;
    }

    # Always revalidate the HTML entry point after deployments.
    location = /index.html {
        try_files $uri =404;

        include /etc/nginx/security-headers.conf;

        add_header Cache-Control
            "no-cache, no-store, must-revalidate" always;
    }

    # React SPA routes may fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
