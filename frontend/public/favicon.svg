    />

    <path
      d="M71 8H53v25H33l13 17h7v30h18z"
      fill="url(#metal-right)"
      stroke="#f5f8fa"
      stroke-opacity=".38"
    />

    <path
      d="M51 1 17 47h17L20 87l42-52H45z"
      fill="url(#bolt)"
