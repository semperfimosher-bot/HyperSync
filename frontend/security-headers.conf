add_header Strict-Transport-Security
    "max-age=31536000; includeSubDomains"
    always;

add_header X-Content-Type-Options
    "nosniff"
    always;

add_header X-Frame-Options
    "DENY"
    always;

add_header Referrer-Policy
    "strict-origin-when-cross-origin"
    always;

add_header Permissions-Policy
    "camera=(), microphone=(), geolocation=(), payment=()"
    always;

add_header Content-Security-Policy
    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://api.hypersynced.app https://*.backblazeb2.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    always;
